[package]
name = "photo-curate"
version = "0.1.0"
description = "AI-powered photo curation and scoring"
authors = ["you"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "photo_curate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
walkdir = "2"
kamadak-exif = "0.6"
reqwest = { version = "0.12", features = ["json", "multipart"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
blake3 = "1.5"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
ort = { version = "2.0.0-rc.12", features = ["ndarray", "coreml"] }
ndarray = "0.17"
regex = "1"

[dev-dependencies]
tempfile = "3"


