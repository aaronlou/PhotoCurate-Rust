[package]
name = "photo-curate"
version = "0.1.8"
description = "AI-powered photo curation and scoring"
authors = ["SIYUAN LOU"]
license = "GPL-3.0-only OR LicenseRef-PhotoCurate-Commercial"
edition = "2021"
rust-version = "1.78"

[lib]
name = "photo_curate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
walkdir = "2"
kamadak-exif = "0.6"
reqwest = { version = "0.12", features = ["json", "multipart"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
blake3 = "1.5"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
ort = { version = "2.0.0-rc.12", features = ["ndarray", "coreml"] }
ndarray = "0.17"
regex = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-iap = "0.9.1"
tauri-plugin-opener = "2.5.4"

[features]
app-store = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
security-framework = "3"

[dev-dependencies]
tempfile = "3"
